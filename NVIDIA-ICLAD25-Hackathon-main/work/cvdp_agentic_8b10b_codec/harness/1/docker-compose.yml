networks:
  default:
    external: true
    name: cvdp-bridge-dataset-f655bdfe
  licnetwork:
    external: true
    name: licnetwork
services:
  direct:
    command: pytest -s --log-cli-level=INFO -o cache_dir=/rundir/harness/.cache /src/test_runner.py
      -v
    env_file: ./src/.env
    image: ghcr.io/hdl/sim/osvb
    networks:
    - default
    volumes:
    - ./src/:/src/:ro
    working_dir: /code/rundir
  xrun:
    command: pytest /src/process.py -v -s
    env_file: ./src/.env
    image: cvdp-cadence-verif:latest
    networks:
    - licnetwork
    volumes:
    - ./src/:/src/:ro
