networks:
  licnetwork:
    external: true
    name: licnetwork
services:
  direct:
    build: .
    command: pytest -o cache_dir=/code/rundir/.cache /src/test_runner.py -v
    env_file: ./src/.env
    volumes:
    - ./src/:/src/:ro
    working_dir: /code/rundir
  xrun:
    command: pytest /src/process.py -v -s
    env_file: ./src/.env
    image: cvdp-cadence-verif:latest
    networks:
    - licnetwork
    volumes:
    - ./src/:/src/:ro
    working_dir: /code/rundir
