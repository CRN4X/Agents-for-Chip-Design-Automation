networks:
  licnetwork:
    external: true
    name: licnetwork
services:
  xrun:
    build: .
    command: pytest -s --log-cli-level=INFO -o cache_dir=/rundir/harness/.cache /src/test_runner.py
      -v
    env_file: ./src/.env
    networks:
    - licnetwork
    volumes:
    - ./src/:/src/:ro
    working_dir: /code/rundir
